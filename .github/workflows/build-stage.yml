# One stage of .github/workflows/nightly.yml: builds the jobs that
# scripts/plan_builds.py planned for one package, one job per platform and
# variant, as in the build matrices of conda-forge feedstocks.
name: Build stage

on:
  workflow_call:
    inputs:
      jobs:
        description: JSON list of the jobs of one package from scripts/plan_builds.py
        required: true
        type: string
      source-env:
        description: The <PACKAGE>_GIT_REV and <PACKAGE>_VERSION lines of scripts/resolve_source.sh
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    # Unlike the default shell of run steps, with -o pipefail
    shell: bash

jobs:
  build:
    name: ${{ matrix.job.platform }} ${{ matrix.job.id }}
    runs-on: ${{ matrix.job.runner }}
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(inputs.jobs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rattler-build uses its output directory as a channel, ahead of the
      # nightly channel. Upstream packages that the run did not rebuild come
      # from the nightly channel instead, so the plan lists no artifacts for
      # them.
      - name: Download the upstream packages built in this run
        if: matrix.job.upstream_artifacts != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ matrix.job.upstream_artifacts }}
          path: output/${{ matrix.job.platform }}
          merge-multiple: true

      # A stage also runs when jobs of the stage before it failed or were
      # cancelled (e.g. no runner picked them up), so fail here with a clear
      # error, before setting up the build, rather than with a misleading
      # solver error. Only a job that gets past this attempts a build, so only
      # its attempt is recorded.
      - name: Check the upstream packages built in this run
        id: upstream
        env:
          PLATFORM: ${{ matrix.job.platform }}
          UPSTREAM: ${{ toJSON(matrix.job.upstream) }}
          KEY: ${{ matrix.job.key }}
        run: |
          missing=0
          # Package file names contain no whitespace
          for path in $(jq --raw-output --arg platform "${PLATFORM}" '.[] | "output/\($platform)/\(.)"' <<< "${UPSTREAM}"); do
            if [ ! -f "${path}" ]; then
              echo "::error::${path} is in neither the channel nor the artifacts of this run, as the job building it failed or was cancelled"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
          mkdir -p .attempted && touch ".attempted/${KEY}"

      # The pixi.lock of the planning job, which is the one the plan was made
      # with, replaces the checked out one before setup-pixi installs it.
      - name: Download the pixi.lock of the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pixi-lock

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          environments: default
          # Pull requests use the cache of main rather than adding their own
          cache-write: ${{ github.ref == 'refs/heads/main' }}

      - name: Set the source revisions and versions
        env:
          SOURCE_ENV: ${{ inputs.source-env }}
        run: echo "${SOURCE_ENV}" >> "${GITHUB_ENV}"

      # rattler-build only writes a package to output/ once its tests pass.
      - name: Build and test
        id: build
        env:
          PACKAGE: ${{ matrix.job.package }}
          VARIANT_OVERRIDES: ${{ toJSON(matrix.job.overrides) }}
        run: |
          args=()
          while IFS= read -r override; do
            args+=(--variant "${override}")
          done < <(jq --raw-output '.[]' <<< "${VARIANT_OVERRIDES}")
          pixi run --frozen build --recipe "recipes/${PACKAGE}" "${args[@]}"

      # Only the planned files are uploaded, not the upstream packages
      # downloaded above. The downstream stages and the next planning job rely
      # on the file names that scripts/plan_builds.py predicted, so a build
      # that wrote other ones has to fail rather than upload nothing.
      - name: Check the built packages
        id: built
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SUBDIR: ${{ matrix.job.subdir }}
          FILES: ${{ toJSON(matrix.job.files) }}
        run: |
          paths="$(jq --raw-output --arg subdir "${SUBDIR}" '.[] | "output/\($subdir)/\(.)"' <<< "${FILES}")"
          {
            echo "paths<<EOF"
            echo "${paths}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          if [ "${BUILD_OUTCOME}" != "success" ]; then
            exit 0
          fi
          missing=0
          # Package file names contain no whitespace
          for path in ${paths}; do
            if [ ! -f "${path}" ]; then
              echo "::error::scripts/plan_builds.py planned ${path}, which the build did not write"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "The build wrote:"
            ls -1 "output/${SUBDIR}"
            exit 1
          fi

      - name: Upload the built packages as artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.job.artifact }}
          path: ${{ steps.built.outputs.paths }}
          if-no-files-found: ignore

      # The cache entry only marks the job as attempted; the hourly planning
      # job lists the keys and leaves these jobs out until the nightly run. A
      # job that lacked its upstream packages did not attempt a build, so it
      # is not recorded and is planned again once they are built.
      - name: Save the attempt record
        if: >-
          always()
          && github.event_name != 'pull_request'
          && steps.upstream.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .attempted
          key: attempted-${{ matrix.job.key }}
