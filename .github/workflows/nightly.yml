name: Nightly builds

# Builds exactly the nightlies whose file names are not in the nightly channel
# yet (see scripts/plan_builds.py), which change with new commits to the main
# branches, with the pins of the global pinning that the recipes use, and with
# the upstream nightlies (see the build task in pixi.toml).
#
# * Hourly: new commits, with the pinning of pixi.lock on main. Jobs that failed
#   before are left out until the nightly run.
# * Nightly and on manual runs: also updates the global pinning, commits it to
#   main if it changed, and retries jobs that failed before.
# * Pull requests: build everything, upload nothing.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE
  schedule:
    # Minute 17, as GitHub delays scheduled runs at the top of the hour the most
    - cron: "17 * * * *"
    # 06:00 UTC, after midnight in the US; keep in sync with NIGHTLY below
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Scheduled runs queue instead, so that a run that takes longer than an hour
  # is not cancelled by the next hourly run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Unlike the default shell of run steps, with -o pipefail
    shell: bash

env:
  NIGHTLY: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * *' }}

jobs:
  # Everything the build jobs must agree on is resolved once here, so that all
  # of them build the same commits against the same pinning even if a main
  # branch moves or a new pinning is released during the run.
  plan:
    name: Plan builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # to list the attempt records in the Actions cache
      actions: read
    outputs:
      source-env: ${{ steps.resolve.outputs.env }}
      pinning-changed: ${{ steps.pinning.outputs.changed }}
      pinning-version: ${{ steps.pinning.outputs.version }}
      cyclus: ${{ steps.plan.outputs.cyclus }}
      cycamore: ${{ steps.plan.outputs.cycamore }}
      cymetric: ${{ steps.plan.outputs.cymetric }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          # The planner renders the recipes in the default environment.
          environments: default plan
          # Pull requests use the cache of main rather than adding their own
          cache-write: ${{ github.ref == 'refs/heads/main' }}

      - name: Resolve the main branch of each package
        id: resolve
        run: |
          for recipe in recipes/*/; do
            bash scripts/resolve_source.sh "$(basename "${recipe}")" >> source.env
          done
          cat source.env
          cat source.env >> "${GITHUB_ENV}"
          {
            echo "env<<EOF"
            cat source.env
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Update the conda-forge global pinning
        id: pinning
        if: env.NIGHTLY == 'true'
        run: |
          pixi update conda-forge-pinning
          version="$(pixi list --frozen --environment default --json conda-forge-pinning | jq --raw-output '.[0].version')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if git diff --quiet pixi.lock; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: List the jobs attempted before
        if: github.event_name == 'schedule' && env.NIGHTLY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?key=attempted-" \
            --jq '.actions_caches[].key | ltrimstr("attempted-")' > attempted.txt
          cat attempted.txt

      - name: Plan the builds
        id: plan
        env:
          ALL: ${{ github.event_name == 'pull_request' }}
        run: |
          args=(--summary "${GITHUB_STEP_SUMMARY}")
          if [ "${ALL}" = "true" ]; then
            args+=(--all)
          fi
          if [ -f attempted.txt ]; then
            args+=(--attempted attempted.txt)
          fi
          pixi run --frozen plan "${args[@]}" | tee -a "${GITHUB_OUTPUT}"

      # Only the jobs of this run need it: the build jobs and commit-pinning
      - name: Upload the pixi.lock of the plan
        if: steps.plan.outputs.any == 'true' || steps.pinning.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixi-lock
          path: pixi.lock
          if-no-files-found: error
          retention-days: 1

  # Commits the updated pinning, so that the hourly runs build with the pinning
  # of the last nightly run and only the nightly runs rebuild for changes of
  # it. The commit is made through the API, so that GitHub signs it.
  commit-pinning:
    name: Commit the updated pinning
    needs: plan
    if: >-
      needs.plan.outputs.pinning-changed == 'true'
      && github.ref == 'refs/heads/main'
      && github.repository == 'cyclus/nightly-builds-conda'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the pixi.lock of the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pixi-lock

      - name: Commit pixi.lock to main
        env:
          GH_TOKEN: ${{ github.token }}
          PINNING_VERSION: ${{ needs.plan.outputs.pinning-version }}
        run: |
          # The blob of pixi.lock on main that this replaces; the API refuses
          # the commit if main changed it since the checkout.
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/pixi.lock" \
            --field branch=main \
            --field message="chore: Update the global pinning to ${PINNING_VERSION}" \
            --field content="$(base64 --wrap=0 pixi.lock)" \
            --field sha="$(git rev-parse HEAD:pixi.lock)" \
            --jq '.commit.html_url'

  # The stages run in dependency order. A stage also runs when the one before
  # it was skipped, i.e. had nothing to build, and then builds against the
  # upstream nightlies in the channel.
  #
  # The calls of build-stage.yml keep the ./... form rather than the
  # self-repository form ($/...) that zizmor asks for, as actionlint (1.7.12)
  # rejects the latter as an invalid reusable workflow call. Switch to it once
  # actionlint supports it.
  cyclus:
    name: cyclus
    needs: plan
    if: needs.plan.outputs.cyclus != '[]'
    uses: ./.github/workflows/build-stage.yml # zizmor: ignore[self-repository]
    with:
      jobs: ${{ needs.plan.outputs.cyclus }}
      source-env: ${{ needs.plan.outputs.source-env }}

  cycamore:
    name: cycamore
    needs: [plan, cyclus]
    if: >-
      !cancelled()
      && needs.plan.result == 'success'
      && needs.plan.outputs.cycamore != '[]'
    uses: ./.github/workflows/build-stage.yml # zizmor: ignore[self-repository]
    with:
      jobs: ${{ needs.plan.outputs.cycamore }}
      source-env: ${{ needs.plan.outputs.source-env }}

  cymetric:
    name: cymetric
    needs: [plan, cyclus, cycamore]
    if: >-
      !cancelled()
      && needs.plan.result == 'success'
      && needs.plan.outputs.cymetric != '[]'
    uses: ./.github/workflows/build-stage.yml # zizmor: ignore[self-repository]
    with:
      jobs: ${{ needs.plan.outputs.cymetric }}
      source-env: ${{ needs.plan.outputs.source-env }}

  upload:
    name: Upload to prefix.dev
    needs: [plan, cyclus, cycamore, cymetric]
    # Upload whatever built and tested successfully, even if other jobs
    # failed, but never from pull requests (whose ref is refs/pull/...) or forks.
    if: >-
      !cancelled()
      && needs.plan.outputs.any == 'true'
      && github.ref == 'refs/heads/main'
      && github.repository == 'cyclus/nightly-builds-conda'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # trusted publishing to prefix.dev, so no API key is stored in the repo
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          environments: default

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true

      # --skip-existing so that a rerun, which plans the packages its first
      # attempt did not upload, does not fail on those it did.
      - name: Upload packages
        run: |
          shopt -s nullglob
          packages=(packages/*.conda)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::No packages were built"
            exit 1
          fi
          pixi run --frozen rattler-build upload prefix --channel cyclus/nightly --skip-existing "${packages[@]}"
