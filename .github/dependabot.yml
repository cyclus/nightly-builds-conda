version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Only update to releases that have been out for a week, so that a
    # compromised release is more likely to be found and yanked first
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
